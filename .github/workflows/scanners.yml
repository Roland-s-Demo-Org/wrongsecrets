name: Leaked Secrets Scan With Trufflehog
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  TruffleHog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # main
        with:
          path: ./
          base: experiment-bed
          head: HEAD
          extra_args: --debug --only-verified
